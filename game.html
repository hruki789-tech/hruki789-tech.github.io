<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジャンプゲーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
  <style>
    :root {
      --blue: #3a5bff;
      --purple: #b03aff;
      --text: #1f2340;
      --muted: #6b7090;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      color: var(--text);
      background: #f4f5ff;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 900;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .wrap {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 800 / 300;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(58, 91, 255, 0.18);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
      text-align: center;
      padding: 16px;
    }
    .overlay[hidden] { display: none; }
    .overlay .big { font-size: clamp(20px, 5vw, 34px); font-weight: 900; }
    .overlay .small { font-size: clamp(12px, 2.6vw, 15px); color: var(--muted); }
    .btn {
      margin-top: 6px;
      border: none;
      border-radius: 999px;
      padding: 10px 28px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      cursor: pointer;
    }
    .help { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
    kbd {
      display: inline-block;
      padding: 1px 8px;
      border: 1px solid #c9cce6;
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
    }
    a.back { color: var(--blue); font-size: 14px; }
  </style>
</head>
<body>
  <h1>JUMP RUN</h1>

  <div class="wrap" id="stage">
    <canvas id="game" width="800" height="300"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovTitle">タイミングよくジャンプ！</div>
      <div class="small" id="ovText">連続ジャンプで高い塔も越えよう</div>
      <button class="btn" id="startBtn">スタート</button>
    </div>
  </div>

  <p class="help"><kbd>スペース</kbd> / <kbd>↑</kbd> / 画面タップでジャンプ　空中でもう一度押すと連続ジャンプ（3段まで）</p>
  <a class="back" href="index.html">← 自己紹介ページへ戻る</a>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const GROUND = H - 50;

    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovText = document.getElementById('ovText');
    const startBtn = document.getElementById('startBtn');

    // ---- 調整用の数値 ----
    const GRAVITY = 2200;        // 落ちる速さ
    const JUMP_POWER = 720;      // ジャンプの初速
    const HOLD_GRAVITY = 0.5;    // 長押し中は重力を弱めて高く跳ぶ
    const AIR_JUMP_POWER = 640;  // 空中ジャンプの初速
    const MAX_JUMPS = 3;         // 連続ジャンプできる回数（地面からの1回＋空中2回）
    const START_SPEED = 480;     // 最初のスクロール速度
    const ACCEL = 28;            // 1秒ごとに速くなる量
    const MAX_SPEED = 1300;

    let best = 0;
    try { best = Number(localStorage.getItem('jumpBest')) || 0; } catch (e) {}

    let state = 'ready'; // ready | playing | over
    let player, obstacles, clouds, puffs, speed, score, spawnTimer, holding, lastTime;

    function reset() {
      player = { x: 90, y: GROUND, w: 40, h: 44, vy: 0, onGround: true, jumps: 0 };
      puffs = [];
      obstacles = [];
      clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 220 + 60, y: 30 + Math.random() * 60, s: 0.6 + Math.random() * 0.6 }));
      speed = START_SPEED;
      score = 0;
      spawnTimer = 1.0;
      holding = false;
    }

    function start() {
      reset();
      state = 'playing';
      overlay.hidden = true;
      startBtn.blur(); // スペースキーでボタンが二重に押されないように
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      state = 'over';
      const s = Math.floor(score);
      const isBest = s > best;
      if (isBest) {
        best = s;
        try { localStorage.setItem('jumpBest', best); } catch (e) {}
      }
      ovTitle.textContent = isBest ? '新記録！ ' + s + ' 点' : 'ゲームオーバー';
      ovText.textContent = 'スコア ' + s + '　／　ベスト ' + best;
      startBtn.textContent = 'もう一回';
      overlay.hidden = false;
    }

    function jump() {
      if (state !== 'playing') return;
      if (player.onGround) {
        player.vy = -JUMP_POWER;
        player.onGround = false;
        player.jumps = 1;
      } else if (player.jumps < MAX_JUMPS) {
        // 空中でもう一度押すと、さらに上へ
        player.vy = -AIR_JUMP_POWER;
        player.jumps++;
        puffs.push({ x: player.x + player.w / 2, y: player.y, life: 0.35 });
      }
    }

    function spawnObstacle() {
      const r = Math.random();
      let o;
      if (score > 150 && r < 0.25) {
        // 高い塔：連続ジャンプしないと越えられない
        o = { type: 'block', w: 26, h: 110 + Math.random() * 50 };
      } else if (r < 0.55) {
        o = { type: 'block', w: 22 + Math.random() * 14, h: 30 + Math.random() * 30 };
      } else if (r < 0.8) {
        o = { type: 'double', w: 54, h: 34 + Math.random() * 16 };
      } else if (score > 250) {
        o = { type: 'bird', w: 36, h: 22, fly: GROUND - 70 - Math.random() * 30 };
      } else {
        o = { type: 'block', w: 26, h: 44 };
      }
      o.x = W + 20;
      obstacles.push(o);
      // 次の障害物までの時間（速いほど間隔も少し詰める）
      const gap = 0.75 + Math.random() * 0.8;
      spawnTimer = gap * (START_SPEED / speed) ** 0.4;
    }

    function rectOf(o) {
      if (o.type === 'bird') return { x: o.x, y: o.fly - o.h, w: o.w, h: o.h };
      return { x: o.x, y: GROUND - o.h, w: o.w, h: o.h };
    }

    function hit(a, b) {
      const m = 5; // 少しだけ当たり判定を甘く
      return a.x + m < b.x + b.w && a.x + a.w - m > b.x &&
             a.y + m < b.y + b.h && a.y + a.h - m > b.y;
    }

    function update(dt) {
      speed = Math.min(MAX_SPEED, speed + dt * ACCEL);
      score += dt * speed / 30;

      // プレイヤー
      const g = (holding && player.vy < 0) ? GRAVITY * HOLD_GRAVITY : GRAVITY;
      player.vy += g * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND) {
        player.y = GROUND;
        player.vy = 0;
        player.onGround = true;
        player.jumps = 0;
      }
      puffs.forEach(f => { f.life -= dt; f.x -= speed * dt * 0.5; });
      puffs = puffs.filter(f => f.life > 0);

      // 障害物
      spawnTimer -= dt;
      if (spawnTimer <= 0) spawnObstacle();
      obstacles.forEach(o => o.x -= speed * dt);
      obstacles = obstacles.filter(o => o.x + o.w > -20);

      // 雲
      clouds.forEach(c => {
        c.x -= speed * 0.15 * c.s * dt;
        if (c.x < -100) { c.x = W + 50; c.y = 30 + Math.random() * 60; }
      });

      // 当たり判定
      const p = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
      for (const o of obstacles) {
        if (hit(p, rectOf(o))) { gameOver(); break; }
      }
    }

    // ---- 描画 ----
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#3a5bff');
    grad.addColorStop(1, '#b03aff');

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function draw(t) {
      // 空
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#e9ecff');
      sky.addColorStop(1, '#fbf6ff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // 雲
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, 34 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
        ctx.ellipse(c.x + 18 * c.s, c.y - 8 * c.s, 20 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // 地面
      ctx.fillStyle = '#dfe2fb';
      ctx.fillRect(0, GROUND, W, H - GROUND);
      ctx.fillStyle = '#3a5bff';
      ctx.fillRect(0, GROUND, W, 3);
      ctx.fillStyle = '#c3c8f2';
      const off = (t * speed / 1000) % 40;
      for (let x = -off; x < W; x += 40) ctx.fillRect(x, GROUND + 18, 14, 3);

      // 障害物
      obstacles.forEach(o => {
        const r = rectOf(o);
        ctx.fillStyle = '#1f2340';
        if (o.type === 'double') {
          roundRect(r.x, r.y + 8, 22, r.h - 8, 5);
          roundRect(r.x + 28, r.y, 26, r.h, 5);
        } else if (o.type === 'bird') {
          ctx.fillStyle = '#b03aff';
          roundRect(r.x, r.y + 6, r.w, 12, 6);
          const flap = Math.sin(t / 80) * 8;
          ctx.beginPath();
          ctx.moveTo(r.x + 10, r.y + 10);
          ctx.lineTo(r.x + 22, r.y + 2 + flap);
          ctx.lineTo(r.x + 26, r.y + 10);
          ctx.fill();
        } else {
          roundRect(r.x, r.y, r.w, r.h, 5);
        }
      });

      // 空中ジャンプのけむり
      puffs.forEach(f => {
        ctx.fillStyle = 'rgba(255,255,255,' + (f.life / 0.35) + ')';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 14 * (1.3 - f.life / 0.35), 0, Math.PI * 2);
        ctx.fill();
      });

      drawDino(player.x, player.y, t);

      // スコア
      ctx.fillStyle = '#1f2340';
      ctx.font = '700 18px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('SCORE ' + String(Math.floor(score)).padStart(5, '0'), W - 20, 34);
      ctx.fillStyle = '#6b7090';
      ctx.font = '400 14px "Noto Sans JP", sans-serif';
      ctx.fillText('BEST ' + String(best).padStart(5, '0'), W - 20, 56);
      ctx.textAlign = 'left';
      ctx.fillText('SPEED ' + (speed / START_SPEED).toFixed(1) + 'x', 20, 34);
      // 残りジャンプ回数
      for (let i = 0; i < MAX_JUMPS; i++) {
        ctx.fillStyle = i < MAX_JUMPS - player.jumps ? '#3fae3a' : '#d3d6ea';
        ctx.beginPath(); ctx.arc(26 + i * 18, 52, 6, 0, Math.PI * 2); ctx.fill();
      }
    }

    // オリジナルの緑の恐竜キャラ（足元 = x, y）
    function drawDino(x, y, t) {
      const running = player.onGround && state === 'playing';
      const bob = running ? Math.abs(Math.sin(t / 70)) * 2 : 0;
      const top = y - 44 - bob;
      const green = '#3fae3a', dark = '#2a7d27';

      // しっぽ
      ctx.fillStyle = green;
      ctx.beginPath();
      ctx.moveTo(x + 6, top + 26);
      ctx.lineTo(x - 8, top + 34);
      ctx.lineTo(x + 8, top + 36);
      ctx.fill();
      // 背中のトゲ
      ctx.fillStyle = dark;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 4 + i * 7, top + 20);
        ctx.lineTo(x + 7 + i * 7, top + 12);
        ctx.lineTo(x + 10 + i * 7, top + 20);
        ctx.fill();
      }
      // 体
      ctx.fillStyle = green;
      ctx.beginPath(); ctx.ellipse(x + 17, top + 29, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
      // おなか
      ctx.fillStyle = '#f3f7e8';
      ctx.beginPath(); ctx.ellipse(x + 22, top + 32, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
      // 頭
      ctx.fillStyle = green;
      ctx.beginPath(); ctx.ellipse(x + 30, top + 10, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 40, top + 14, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
      // 目
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + 32, top + 6, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1f2340';
      ctx.beginPath(); ctx.arc(x + 33.5, top + 6, 2.2, 0, Math.PI * 2); ctx.fill();
      // 鼻の穴・口
      ctx.fillRect(x + 45, top + 12, 2, 2);
      ctx.fillRect(x + 36, top + 17, 8, 1.5);
      // 足
      ctx.fillStyle = dark;
      if (running) {
        const step = Math.floor(t / 80) % 2;
        ctx.fillRect(x + 8 + step * 5, y - 6, 7, 6);
        ctx.fillRect(x + 22 - step * 5, y - 6, 7, 6);
      } else {
        ctx.fillRect(x + 10, y - 6, 7, 6);
        ctx.fillRect(x + 22, y - 6, 7, 6);
      }
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - lastTime) / 1000);
      lastTime = now;
      if (state === 'playing') update(dt);
      draw(now);
      if (state === 'playing') requestAnimationFrame(loop);
    }

    // ---- 操作 ----
    function press(e) {
      if (state !== 'playing') { start(); return; }
      holding = true;
      jump();
    }
    function release() { holding = false; }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!e.repeat) press();
      }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') release();
    });
    const stage = document.getElementById('stage');
    stage.addEventListener('pointerdown', e => {
      if (e.target === startBtn) return;
      e.preventDefault();
      press();
    });
    window.addEventListener('pointerup', release);
    startBtn.addEventListener('click', start);

    // 最初の画面
    reset();
    draw(0);
  </script>
</body>
</html>
